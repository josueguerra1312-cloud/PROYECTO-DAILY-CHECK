[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gdl-pernocta-scheduler"
version = "0.1.0"
description = "Genera y ordena ventanas de pernocta y transito para aeronaves en GDL."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
gdl-pernocta = "gdl_pernocta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
